    <script>
        let currentSubwayZoom = 1.0;
        let currentMapVersion = 'airport';

        const subwayMapFiles = {
            airport: './2026%20South%20Korea%20Subway%20Map%20(Chinese%20Version%20with%20Airport%20Signage).png',
            simplified: './Simplified%20Chinese.jpg',
            bilingual: './Korean-English%20bilingual%20version.jpg'
        };

        function switchSubwayMapVersion(versionKey) {
            if (!subwayMapFiles[versionKey]) return;
            currentMapVersion = versionKey;

            const img = document.getElementById('subwayMapImage');
            const link = document.getElementById('subwayMapOriginalLink');
            if (img) img.src = subwayMapFiles[versionKey];
            if (link) link.href = subwayMapFiles[versionKey];

            const tabKeys = ['airport', 'simplified', 'bilingual'];
            tabKeys.forEach(key => {
                const tab = document.getElementById(`mapTab-${key}`);
                if (tab) {
                    if (key === versionKey) {
                        tab.className = 'px-3.5 py-2 rounded-xl text-xs font-bold shrink-0 bg-indigo-600 text-white shadow-sm';
                    } else {
                        tab.className = 'px-3.5 py-2 rounded-xl text-xs font-bold shrink-0 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200';
                    }
                }
            });

            resetSubwayMapZoom();
        }

        function zoomSubwayMap(delta) {
            currentSubwayZoom = Math.min(3.5, Math.max(0.6, currentSubwayZoom + delta));
            applySubwayMapTransform();
        }

        function resetSubwayMapZoom() {
            currentSubwayZoom = 1.0;
            applySubwayMapTransform();
        }

        function applySubwayMapTransform() {
            const img = document.getElementById('subwayMapImage');
            const zoomText = document.getElementById('subwayZoomPercentage');
            if (img) {
                if (currentSubwayZoom <= 1.0) {
                    img.classList.remove('max-w-none');
                    img.classList.add('max-w-full');
                } else {
                    img.classList.remove('max-w-full');
                    img.classList.add('max-w-none');
                }
                img.style.transform = `scale(${currentSubwayZoom})`;
            }
            if (zoomText) {
                zoomText.innerText = `${Math.round(currentSubwayZoom * 100)}%`;
            }
        }

        function setQuickRoute(origin, dest) {
            const originEl = document.getElementById('routeOriginInput');
            const destEl = document.getElementById('routeDestInput');
            if (originEl) originEl.value = origin;
            if (destEl) destEl.value = dest;
            handlePlanRoute();
        }

        function showToast(message) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');

                            <i data-lucide="map" class="w-3.5 h-3.5 shrink-0"></i> Naver
                        </a>
                        <a href="${kakaoUrl}" target="_blank" rel="noopener noreferrer" class="flex-1 sm:flex-initial px-2 py-2 bg-amber-400 hover:bg-amber-500 text-slate-900 text-[11px] sm:text-xs font-bold rounded-xl transition flex items-center justify-center gap-1">
                            <i data-lucide="navigation" class="w-3.5 h-3.5 text-amber-950 shrink-0"></i> Kakao
                        </a>
                    </div>
                </div>
            `;
        }

        function renderDynamicRoute(container, origin, dest, naverUrl, googleUrl, kakaoUrl) {
            const originLandmark = getLandmarkInfo(origin);
            const destLandmark = getLandmarkInfo(dest);

            const originStationText = originLandmark ? `${origin} (近 ${originLandmark.station} ${originLandmark.exit})` : `${origin} 站`;
            const destStationText = destLandmark ? `${dest} (近 ${destLandmark.station} ${destLandmark.exit})` : `${dest} 站`;

            let landmarkNoticeHtml = '';
            if (originLandmark || destLandmark) {
                landmarkNoticeHtml = `
                    <div class="p-3 bg-amber-50 dark:bg-amber-950/40 rounded-xl border border-amber-200/60 dark:border-amber-800/60 text-xs text-amber-900 dark:text-amber-200 mb-3 space-y-1">
                        <div class="font-bold flex items-center gap-1.5">
                            <i data-lucide="map-pin" class="w-4 h-4 text-amber-600"></i> 地點最近地鐵站識別結果：
                        </div>
                        ${originLandmark ? `<div>🟢 出發點「${origin}」➔ 最近車站：<strong>${originLandmark.station}</strong> (${originLandmark.line} ${originLandmark.exit})</div>` : ''}
                        ${destLandmark ? `<div>🔴 目的地「${dest}」➔ 最近車站：<strong>${destLandmark.station}</strong> (${destLandmark.line} ${destLandmark.exit})</div>` : ''}
                    </div>
                `;
            }

            container.innerHTML = `
                ${landmarkNoticeHtml}
                <div class="bg-gradient-to-r from-indigo-900 via-slate-900 to-indigo-950 text-white p-4 rounded-xl shadow-md space-y-2">
                    <div class="text-xs text-indigo-300 font-semibold mb-1 flex items-center gap-1.5">
                        <i data-lucide="compass" class="w-4 h-4 text-emerald-400"></i> 自訂地點路線規劃與路網算路
                    </div>
                    <h4 class="text-base font-extrabold">${originStationText} ➔ ${destStationText}</h4>
                    <p class="text-xs text-slate-300 leading-relaxed pt-1">
                        系統已為您調用首爾地鐵與大眾運輸實時路網 API！點擊下方按鈕可直接帶入「起點 ➔ 終點」，開啟三大地圖實時點對點導航與最佳候車月台指引。
                    </p>
                </div>

                <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-end gap-1.5 mt-3">
                    <a href="${googleUrl}" target="_blank" rel="noopener noreferrer" class="flex-1 sm:flex-initial px-3 py-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-200 text-xs font-bold rounded-xl transition flex items-center justify-center gap-1">
                        <i data-lucide="map-pin" class="w-3.5 h-3.5 text-blue-500 shrink-0"></i> Google 導航
                    </a>
                    <a href="${naverUrl}" target="_blank" rel="noopener noreferrer" class="flex-1 sm:flex-initial px-3 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl shadow-md transition flex items-center justify-center gap-1">
                        <i data-lucide="map" class="w-3.5 h-3.5 shrink-0"></i> Naver 導航
                    </a>
                    <a href="${kakaoUrl}" target="_blank" rel="noopener noreferrer" class="flex-1 sm:flex-initial px-3 py-2.5 bg-amber-400 hover:bg-amber-500 text-slate-900 text-xs font-bold rounded-xl transition flex items-center justify-center gap-1">
                        <i data-lucide="navigation" class="w-3.5 h-3.5 text-amber-950 shrink-0"></i> Kakao 導航
                    </a>
                </div>
            `;
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('seoul_dark_mode', isDark);
        }

        if (localStorage.getItem('seoul_dark_mode') === 'true' || (!('seoul_dark_mode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        function toggleHamburgerMenu() {
            const drawer = document.getElementById('hamburgerMenuDrawer');
            if (drawer) {
                drawer.classList.toggle('hidden');
            }
        }

        document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
    </script>
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>
</body>

</html>
