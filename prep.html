<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 行前準備與行李檢查清單</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857' }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
        }

        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body
    class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen font-sans transition-colors duration-300">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 glass-panel border-b border-slate-200/80 dark:border-slate-800/80 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div
                    class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-500 to-indigo-600 flex items-center justify-center text-white shadow-md font-bold text-lg">
                    📋
                </div>
                <div>
                    <h1
                        class="font-bold text-base sm:text-lg tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
                        行前準備與行李備忘
                        <span
                            class="text-xs font-normal px-2 py-0.5 rounded-full bg-blue-100 dark:bg-blue-900/50 text-blue-700 dark:text-blue-300 border border-blue-200">Travel
                            Checklist</span>
                    </h1>
                </div>
            </div>

            <!-- Quick Header Action Buttons -->
            <div class="flex items-center space-x-1.5 sm:space-x-2 shrink-0">
                <button onclick="toggleDarkMode()" aria-label="Toggle Dark Mode"
                    class="p-1.5 sm:p-2 rounded-xl text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
                    <i data-lucide="sun" class="w-4 h-4 hidden dark:block text-amber-400"></i>
                </button>

                <!-- Hamburger Menu Trigger Button -->
                <button onclick="toggleHamburgerMenu()" aria-label="Open Navigation Menu"
                    class="px-3 py-1.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold text-xs shadow-md transition active:scale-95 flex items-center gap-1.5">
                    <i data-lucide="menu" class="w-4 h-4"></i>
                    <span>選單</span>
                </button>
            </div>
        </div>

        <!-- HAMBURGER MENU DROPDOWN DRAWER -->
        <div id="hamburgerMenuDrawer"
            class="hidden absolute top-16 right-4 z-50 w-72 bg-white/95 dark:bg-slate-900/95 backdrop-blur-2xl border border-slate-200/80 dark:border-slate-800/80 rounded-2xl shadow-2xl p-3 space-y-1.5 transition-all duration-300">
            <div
                class="px-3 py-2 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs font-bold text-slate-400">
                <span>🧭 導覽選單</span>
                <button onclick="toggleHamburgerMenu()"
                    class="text-slate-400 hover:text-slate-600 dark:hover:text-white">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <a href="index.html"
                class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-emerald-50 dark:hover:bg-emerald-950/60 text-xs font-bold text-slate-700 dark:text-slate-200 transition">
                <span class="text-lg">🗓️</span>
                <div>
                    <div>天數行程</div>
                    <div class="text-[10px] text-slate-400 font-normal">6D5N 詳細每日行程與飯店</div>
                </div>
            </a>
            <a href="subway.html"
                class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-emerald-50 dark:hover:bg-emerald-950/60 text-xs font-bold text-slate-700 dark:text-slate-200 transition">
                <span class="text-lg">🗺️</span>
                <div>
                    <div>首爾地鐵</div>
                    <div class="text-[10px] text-slate-400 font-normal">地鐵地圖與點對點路線規劃</div>
                </div>
            </a>
            <a href="currency.html"
                class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-emerald-50 dark:hover:bg-emerald-950/60 text-xs font-bold text-slate-700 dark:text-slate-200 transition">
                <span class="text-lg">💱</span>
                <div>
                    <div>匯率算盤</div>
                    <div class="text-[10px] text-slate-400 font-normal">韓元 ↔ 台幣即時計算機</div>
                </div>
            </a>
            <a href="weather.html"
                class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-emerald-50 dark:hover:bg-emerald-950/60 text-xs font-bold text-slate-700 dark:text-slate-200 transition">
                <span class="text-lg">🌤️</span>
                <div>
                    <div>天氣預報</div>
                    <div class="text-[10px] text-slate-400 font-normal">逐時氣溫與降雨機率預報</div>
                </div>
            </a>
            <a href="phrases.html"
                class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-emerald-50 dark:hover:bg-emerald-950/60 text-xs font-bold text-slate-700 dark:text-slate-200 transition">
                <span class="text-lg">🗣️</span>
                <div>
                    <div>實用韓語</div>
                    <div class="text-[10px] text-slate-400 font-normal">5 大情境會話與一鍵複製</div>
                </div>
            </a>
            <a href="prep.html"
                class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl bg-blue-50 dark:bg-blue-950/60 text-blue-700 dark:text-blue-300 font-bold text-xs transition">
                <span class="text-lg">📋</span>
                <div>
                    <div>行前清單</div>
                    <div class="text-[10px] opacity-75 font-normal">證件、網卡、轉接頭清單</div>
                </div>
            </a>
        </div>

    </header>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 py-6 pb-24 md:pb-8">
        <!-- Banner Header -->
        <div
            class="bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-800 text-white rounded-2xl p-5 sm:p-6 shadow-lg mb-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                    <h2 class="text-xl sm:text-2xl font-extrabold flex items-center gap-2">
                        <span>📋 韓國首爾行李與準備清單</span>
                    </h2>
                    <p class="text-xs sm:text-sm text-blue-100 mt-1 leading-relaxed">
                        出發前逐一勾選確認！可自行新增/刪除檢查項目，系統自動記憶勾選狀態與自訂項目。
                    </p>
                </div>
                <button onclick="resetPrepChecklist()"
                    class="self-start sm:self-auto shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 bg-white/15 hover:bg-white/25 text-white rounded-xl text-xs font-semibold backdrop-blur-md transition active:scale-95 cursor-pointer">
                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                    <span>還原預設清單</span>
                </button>
            </div>

            <!-- Progress Bar -->
            <div class="mt-4 bg-black/20 rounded-full h-3 p-0.5 overflow-hidden">
                <div id="prepProgressBar"
                    class="bg-gradient-to-r from-emerald-400 to-teal-300 h-full rounded-full transition-all duration-500 w-0">
                </div>
            </div>
            <div class="flex justify-between text-[11px] font-bold text-blue-200 mt-1">
                <span id="prepProgressText">準備完成度: 0%</span>
                <span id="prepCountText">0 / 0 項已完成</span>
            </div>
        </div>

        <!-- Add Custom Item Input Card -->
        <div
            class="bg-white dark:bg-slate-900 rounded-2xl p-4 sm:p-5 border border-slate-200/80 dark:border-slate-800 shadow-md mb-6">
            <h3 class="text-sm font-bold text-slate-800 dark:text-white mb-3 flex items-center gap-2">
                <i data-lucide="plus-circle" class="w-4 h-4 text-blue-500"></i> 新增自訂檢查項目
            </h3>
            <form onsubmit="handleGlobalAdd(event)" class="flex flex-col sm:flex-row gap-2.5">
                <select id="globalCategorySelect"
                    class="px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="📄 必備證件與機票憑證">📄 必備證件與機票憑證</option>
                    <option value="💳 支付、網卡與交通卡">💳 支付、網卡與交通卡</option>
                    <option value="🔌 電器產品與轉接頭">🔌 電器產品與轉接頭</option>
                    <option value="👕 衣物穿搭與舒適鞋款">👕 衣物穿搭與舒適鞋款</option>
                    <option value="💊 個人藥品與盥洗個人用品">💊 個人藥品與盥洗個人用品</option>
                    <option value="📌 個人自訂新增清單">📌 個人自訂新增清單</option>
                </select>
                <input type="text" id="globalItemInput" placeholder="請輸入欲新增的項目名稱 (例：備用眼鏡、雨傘、太陽眼鏡...)"
                    class="flex-1 px-4 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs text-slate-800 dark:text-slate-100 outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit"
                    class="px-4 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition active:scale-95 flex items-center justify-center gap-1.5 shrink-0">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>新增項目</span>
                </button>
            </form>
        </div>

        <!-- Checklist Categories -->
        <div id="checklistCategoriesContainer" class="space-y-6">
            <!-- Rendered Dynamically -->
        </div>
    </main>

    <script>
        const defaultPrepSections = [
            {
                title: "📄 必備證件與機票憑證",
                icon: "file-text",
                color: "rose",
                items: [
                    { id: "p1", name: "護照正本 (需確認有效期在 6 個月以上)" },
                    { id: "p2", name: "高雄 ✈️ 仁川機票電子憑證 (含來回行程單)" },
                    { id: "p3", name: "永登浦可可酒店 & 首爾萬楓酒店預訂單" },
                    { id: "p4", name: "護照影本與 2 吋大頭照 2 張 (備用)" }
                ]
            },
            {
                title: "💳 支付、網卡與交通卡",
                icon: "credit-card",
                color: "emerald",
                items: [
                    { id: "p5", name: "韓國 eSIM / SIM 卡 (提前開通並確認 Roaming)" },
                    { id: "p6", name: "T-money 交通卡 (每人 1 張，可於超商加值)" },
                    { id: "p7", name: "WOWPASS 儲值卡 / 雙幣海外回饋信用卡" },
                    { id: "p8", name: "韓元現金備用 (建議準備約 20~30 萬韓元)" }
                ]
            },
            {
                title: "🔌 電器產品與轉接頭",
                icon: "zap",
                color: "amber",
                items: [
                    { id: "p9", name: "韓國專用 4.8mm 雙圓孔插頭轉接器 (2~3個)" },
                    { id: "p10", name: "行動電源 (10,000mAh+，不可託運需隨身攜帶)" },
                    { id: "p11", name: "手機充電線與多孔 USB 充電頭" }
                ]
            },
            {
                title: "👕 衣物穿搭與舒適鞋款",
                icon: "shirt",
                color: "indigo",
                items: [
                    { id: "p12", name: "短袖上衣與輕便上衣 (9月白天舒適)" },
                    { id: "p13", name: "薄外套 / 防風外套 (早晚溫差約 18°C~20°C)" },
                    { id: "p14", name: "舒適好走球鞋 / 慢跑鞋 (日行萬步必備)" },
                    { id: "p15", name: "可折疊隨身雨傘 / 輕便雨衣" }
                ]
            },
            {
                title: "💊 個人藥品與盥洗個人用品",
                icon: "heart-pulse",
                color: "purple",
                items: [
                    { id: "p16", name: "個人常備藥物 (感冒藥、胃藥、止痛藥、暈車藥)" },
                    { id: "p17", name: "休足時間 / 透氣 OK 繃 (緩解腳痠)" },
                    { id: "p18", name: "牙膏牙刷旅行組與洗沐用品 (部分飯店不提供)" },
                    { id: "p19", name: "保濕保養品與護唇膏" }
                ]
            }
        ];

        let checkedItems = JSON.parse(localStorage.getItem('seoul_prep_checked') || '[]');
        let deletedItems = JSON.parse(localStorage.getItem('seoul_prep_deleted') || '[]');
        let customItems = JSON.parse(localStorage.getItem('seoul_prep_custom') || '[]');

        function getMergedSections() {
            // Clone default sections and filter out deleted items
            let sections = defaultPrepSections.map(sec => ({
                ...sec,
                items: sec.items.filter(item => !deletedItems.includes(item.id))
            }));

            // Group custom items into sections
            customItems.forEach(item => {
                if (deletedItems.includes(item.id)) return;

                let targetSec = sections.find(s => s.title === item.categoryTitle);
                if (!targetSec) {
                    targetSec = sections.find(s => s.title === '📌 個人自訂新增清單');
                    if (!targetSec) {
                        targetSec = {
                            title: '📌 個人自訂新增清單',
                            icon: 'bookmark',
                            color: 'blue',
                            items: []
                        };
                        sections.push(targetSec);
                    }
                }
                targetSec.items.push(item);
            });

            return sections;
        }

        function renderPrepChecklist() {
            const container = document.getElementById('checklistCategoriesContainer');
            container.innerHTML = '';

            const sections = getMergedSections();
            let totalCount = 0;
            let completedCount = 0;

            sections.forEach((section, sIdx) => {
                if (section.items.length === 0 && section.title === '📌 個人自訂新增清單') return;

                totalCount += section.items.length;

                const catCard = document.createElement('div');
                catCard.className = "bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200/80 dark:border-slate-800 shadow-md";

                let itemsHtml = '';
                section.items.forEach(item => {
                    const isChecked = checkedItems.includes(item.id);
                    if (isChecked) completedCount++;

                    itemsHtml += `
                        <div class="flex items-center justify-between p-2.5 sm:p-3 bg-slate-50 dark:bg-slate-800/60 hover:bg-blue-50/70 dark:hover:bg-slate-800 rounded-xl transition border border-slate-100 dark:border-slate-700/50 group">
                            <label class="flex items-center gap-3 flex-1 cursor-pointer select-none overflow-hidden pr-2">
                                <input type="checkbox" onchange="togglePrepItem('${item.id}')" ${isChecked ? 'checked' : ''} class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 shrink-0">
                                <span class="text-xs sm:text-sm font-semibold truncate ${isChecked ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-200'}">${item.name}</span>
                            </label>
                            <button onclick="deletePrepItem('${item.id}', event)" title="刪除此項目" class="p-1 text-slate-300 hover:text-rose-500 dark:text-slate-600 dark:hover:text-rose-400 opacity-60 hover:opacity-100 transition rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/50 shrink-0">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    `;
                });

                catCard.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            <i data-lucide="${section.icon || 'check-square'}" class="w-5 h-5 text-blue-500"></i> ${section.title}
                        </h3>
                        <span class="text-xs text-slate-400 font-normal">${section.items.length} 項</span>
                    </div>
                    <div class="space-y-2">
                        ${itemsHtml || '<p class="text-xs text-slate-400 italic p-2">（此分類尚無項目，點擊上方可新增）</p>'}
                    </div>
                `;

                container.appendChild(catCard);
            });

            // Update progress
            const percentage = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;
            document.getElementById('prepProgressBar').style.width = `${percentage}%`;
            document.getElementById('prepProgressText').innerText = `準備完成度: ${percentage}%`;
            document.getElementById('prepCountText').innerText = `${completedCount} / ${totalCount} 項已完成`;

            lucide.createIcons();
        }

        function togglePrepItem(id) {
            if (checkedItems.includes(id)) {
                checkedItems = checkedItems.filter(i => i !== id);
            } else {
                checkedItems.push(id);
            }
            localStorage.setItem('seoul_prep_checked', JSON.stringify(checkedItems));
            renderPrepChecklist();
        }

        function handleGlobalAdd(e) {
            e.preventDefault();
            const inputEl = document.getElementById('globalItemInput');
            const selectEl = document.getElementById('globalCategorySelect');
            const name = inputEl.value.trim();
            if (!name) return;

            const newItem = {
                id: 'custom_' + Date.now(),
                name: name,
                categoryTitle: selectEl.value
            };

            customItems.push(newItem);
            localStorage.setItem('seoul_prep_custom', JSON.stringify(customItems));
            inputEl.value = '';
            renderPrepChecklist();
        }

        function deletePrepItem(id, event) {
            if (event) event.stopPropagation();

            if (!deletedItems.includes(id)) {
                deletedItems.push(id);
                localStorage.setItem('seoul_prep_deleted', JSON.stringify(deletedItems));
            }

            // Remove from customItems if it's a custom item
            customItems = customItems.filter(i => i.id !== id);
            localStorage.setItem('seoul_prep_custom', JSON.stringify(customItems));

            // Remove from checkedItems if checked
            checkedItems = checkedItems.filter(i => i !== id);
            localStorage.setItem('seoul_prep_checked', JSON.stringify(checkedItems));

            renderPrepChecklist();
        }

        function resetPrepChecklist() {
            if (confirm('確定要還原清單為預設初始狀態嗎？這將會清除自訂刪除記錄與自訂新增項目。')) {
                deletedItems = [];
                customItems = [];
                localStorage.setItem('seoul_prep_deleted', JSON.stringify(deletedItems));
                localStorage.setItem('seoul_prep_custom', JSON.stringify(customItems));
                renderPrepChecklist();
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('seoul_dark_mode', isDark);
        }

        if (localStorage.getItem('seoul_dark_mode') === 'true' || (!('seoul_dark_mode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        function toggleHamburgerMenu() {
            const drawer = document.getElementById('hamburgerMenuDrawer');
            if (drawer) {
                drawer.classList.toggle('hidden');
            }
        }

        document.addEventListener('DOMContentLoaded', renderPrepChecklist);
    </script>
</body>

</html>
